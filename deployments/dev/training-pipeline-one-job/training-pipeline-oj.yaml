#
# https://kubernetes.io/docs/concepts/workloads/controllers/job/
#
---
apiVersion: batch/v1
kind: Job
metadata:
  name: training-pipeline-job-aed1
  namespace: training
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300  # Clean up 5 minutes after completion
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: training-pipeline
          image: training-pipeline:dev
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"      # Max 2 CPU cores
              memory: "6Gi"     # Increased from 2Gi to 6Gi
          envFrom:
            - configMapRef:
                name: training-pipeline
